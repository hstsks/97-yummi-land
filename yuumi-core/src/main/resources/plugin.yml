name: YuumiLandCore
version: '0.1.0-SNAPSHOT'
main: kr.yuumi97.core.YuumiPlugin
api-version: '1.21'
authors: [Antigravity_97Land]
description: 유미의 97랜드 · 듀얼 직업 · 심리스 던전 · 만능 가이드북
softdepend: [Vault, Essentials, AuraSkills, EvenMoreFish, WorldEdit, TAB]
commands:
  yuumi:
    description: 코어 관리 및 만능 가이드북
    aliases: [97랜드, 길찾기]
  guide:
    description: 허브 워프와 8대 컨텐츠 백과사전
    aliases: [가이드, 메뉴, menu, 책]
  home:
    description: 내 소유 또는 공동거주 부지 현관으로 이동
    aliases: [집, 부지, 내땅, myplot]
  workshop:
    description: 문턱의 만능 길드 대공방으로 이동
    aliases: [공방, 대공방]
  way:
    description: 3D 별빛 길잡이 시작 또는 종료
    aliases: [길잡이, navi]
  shops:
    description: 5대 전문 상점가로 이동
    aliases: [상점]
  bank:
    description: 츄르 중앙 은행으로 이동
    aliases: [은행]
  smith:
    description: 별빛 대장간으로 이동
    aliases: [대장간]
  dungeon:
    description: 문턱의 미궁 집결 관문으로 이동
    aliases: [미궁]
  townhall:
    description: 고양이 마을 회관으로 이동
    aliases: [회관]
  onsen:
    description: 노천 온천과 식당으로 이동
    aliases: [온천, 식당]
  arena:
    description: 야외 레이드 결투장으로 이동
    aliases: [결투장]
  party:
    description: 1~8인 파티 초대·수락·탈퇴·추방·정보
    aliases: [파티]
  titles:
    description: 획득한 명예 칭호 장착
    aliases: [칭호, title]
  job:
    description: 전투·생활 성향 교관으로 이동
    aliases: [전직]
  stock:
    description: 카지노 2층 증권 거래소로 이동
    aliases: [증권]
  churu:
    description: 지갑·은행 잔액 확인 및 온라인 송금
    aliases: [츄르, 돈]
  altar:
    description: 문턱의 서 제단과 차원 성소로 이동
    aliases: [제단, 문턱의서]
  casino:
    description: 황금 냥냥 카지노와 경묘장으로 이동
    aliases: [카지노, 도박, 경묘]
  duelbet:
    description: 카지노 내부 1대1 실물 칩 주사위 데스매치
    aliases: [도박신청, 도박수락]
  quest:
    description: 의뢰 담당 고양이 마을 회관으로 이동
    aliases: [의뢰, 일일의뢰, 일퀘, 주간의뢰]
  codex:
    description: 수집 도감 박물관으로 이동
    aliases: [도감, 수집도감]
  land:
    description: 분양 등기소로 이동
    aliases: [땅, 분양, 등기소]
  raid:
    description: 야외 레이드 결투장으로 이동
    aliases: [레이드, 보스]
