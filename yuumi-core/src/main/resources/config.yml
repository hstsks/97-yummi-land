# ============================================================
# 🐱 유미의 97랜드 (YuumiLandCore) 설정 파일
# 3~4주 방송형 시즌 · 전용 평화 허브 도시(yuumi_hub) · 12필지 분양 · 실물 칩 카지노
# ============================================================

server-theme:
  title: "<gradient:#ff85c0:#ffd666><bold>유미의 97랜드</bold></gradient>"
  currency-name: "츄르"
  starting-churu: 2000.0

resource-pack:
  enabled: true
  # 서버 PC의 공인 IP 또는 도메인. 비워두면 접속한 서버 주소(HostString)를 자동 감지해 포트를 붙여 전송합니다!
  public-host: ""
  http-port: 25566
  prompt-message: "🐱 [유미의 97랜드] 고양이 허브 도시 · 문턱의 미궁 · 성향 성물 공식 리소스팩을 적용합니다!"
  required: false

# 문턱의 서 자율 페이즈 해금 목표치 (8인 3~4주 시즌 밸런스 기준)
threshold-altar:
  phase2-nether:
    pages-required: 45
    churu-required: 45000
    supply-points-required: 800
  phase3-end:
    pages-required: 100
    churu-required: 140000
    supply-points-required: 2000

# 경제 · AuraSkills 숙련도 & 수집 도감 납품 우대 보너스
economy:
  skill-sell-bonus-per-level: 0.025
  skill-sell-bonus-max: 0.75

# 황금 냥냥 카지노 (2층 단독 홀 & 실시간 경묘)
casino:
  initial-jackpot: 20000.0
  jackpot-rake-rate: 0.15
  welfare-threshold: 100.0
  welfare-grant: 300.0

# 남쪽 벚꽃 대교 너머 12필지 건축·농장 분양 단지 가격
plots:
  small-price: 4000.0
  medium-price: 18000.0
  large-price: 55000.0
  sell-refund-rate: 0.70

# 원정 사망 시 인벤토리 100% 보존 + 유미 응급 치유소 후송 비용 (은행 예금은 100% 면제!)
death-clinic:
  wallet-fee-rate: 0.08
  wallet-fee-max: 5000.0
  durability-loss-rate: 0.12

