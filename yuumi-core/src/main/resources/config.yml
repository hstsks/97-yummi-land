  http-port: 25566
  prompt-message: "🐱 [유미의 97랜드 v3.0] 고양이 허브 도시 · 문턱의 미궁 · 성향 성물 공식 리소스팩을 적용합니다!"
  required: false

# 문턱의 서 자율 페이즈 해금 목표치 (8인 3~4주 시즌 밸런스 기준)
